{% extends "base.html" %}

{% block titre %}Inscription{% endblock %}

{% block contenu %}
<div class="conteneur conteneur-auth">
    <div class="carte-auth">
        <h1>Créer un compte</h1>
        <p class="sous-titre-auth">Rejoignez EcoTasks et commencez à agir pour la planète.</p>

        <form method="POST" action="{{ url_for('auth.inscription') }}" id="formulaire-inscription">
            <div class="champ">
                <label for="nom">Nom complet</label>
                <input type="text" id="nom" name="nom" value="{{ nom|default('') }}"
                       required autocomplete="name" placeholder="Jean Dupont">
            </div>

            <div class="champ">
                <label for="email">Adresse email</label>
                <input type="email" id="email" name="email" value="{{ email|default('') }}"
                       required autocomplete="email" placeholder="votre@email.fr">
            </div>

            <div class="champ">
                <label for="mot_de_passe">Mot de passe</label>
                <input type="password" id="mot_de_passe" name="mot_de_passe"
                       required minlength="6" autocomplete="new-password"
                       placeholder="6 caractères minimum">
            </div>

            <div class="champ">
                <label for="confirmation">Confirmer le mot de passe</label>
                <input type="password" id="confirmation" name="confirmation"
                       required minlength="6" autocomplete="new-password"
                       placeholder="Répétez le mot de passe">
            </div>

            <button type="submit" class="btn-principal btn-plein">Créer mon compte</button>
        </form>

        <p class="lien-auth">
            Déjà inscrit ?
            <a href="{{ url_for('auth.connexion') }}">Se connecter</a>
        </p>
    </div>
</div>
{% endblock %}
