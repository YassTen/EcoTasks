{% extends "base.html" %}

{% block titre %}Modifier le profil{% endblock %}

{% block contenu %}
<div class="conteneur conteneur-auth">
    <div class="carte-auth">
        <h1>Modifier le profil</h1>

        <form method="POST" action="{{ url_for('utilisateurs.modifier_profil') }}" id="formulaire-modifier-profil">
            <div class="champ">
                <label for="nom">Nom complet</label>
                <input type="text" id="nom" name="nom" value="{{ utilisateur.nom }}"
                       required autocomplete="name">
            </div>

            <div class="champ">
                <label for="email">Adresse email</label>
                <input type="email" id="email" name="email" value="{{ utilisateur.email }}"
                       required autocomplete="email">
            </div>

            <hr class="separateur">

            <p class="note">Laissez vide pour conserver le mot de passe actuel.</p>

            <div class="champ">
                <label for="nouveau_mdp">Nouveau mot de passe</label>
                <input type="password" id="nouveau_mdp" name="nouveau_mdp"
                       minlength="6" autocomplete="new-password"
                       placeholder="6 caractères minimum">
            </div>

            <div class="champ">
                <label for="confirmation_mdp">Confirmer le nouveau mot de passe</label>
                <input type="password" id="confirmation_mdp" name="confirmation_mdp"
                       minlength="6" autocomplete="new-password"
                       placeholder="Répétez le mot de passe">
            </div>

            <div class="boutons-formulaire">
                <button type="submit" class="btn-principal btn-plein">Enregistrer</button>
                <a href="{{ url_for('utilisateurs.profil') }}" class="btn-secondaire">Annuler</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
